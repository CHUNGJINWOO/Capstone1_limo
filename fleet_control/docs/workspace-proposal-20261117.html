else{$('pageTitle').textContent='Spatial monitor';$('pageCaption').textContent='지도와 센서 관찰 전용 · 선택 소속은 서버 증거가 있을 때만 표시';$('titleRight').innerHTML=`<div class="subnav"><button disabled>Building</button><button data-spatial="floor" class="${spatialMode==='floor'?'active':''}">Floor</button><button data-spatial="driving" class="${spatialMode==='driving'?'active':''}">Driving</button></div>`;w.style.gridTemplateColumns=spatialMode==='floor'?'minmax(0,1fr)':'minmax(0,1fr) 302px';w.innerHTML=`<section class="map-column">${map()}</section>`+(spatialMode==='floor'?'':`<section class="cameras"><div class="panel camera">${panel('RGB / AI <small>독립 영상 소스</small>','')}<div class="camera-box">◉<br>스트림 미연결<small>실제 프레임 미수신</small></div><div class="camera-label">시각 / 지연 UNKNOWN <span>연결 설정 ›</span></div></div><div class="panel camera">${panel('Depth <small>UNAVAILABLE</small>','')}<div class="camera-box">▧<br>영상 API 미제공<small>단위 · 컬러맵 · 범위 미확인</small></div><div class="camera-label">거리 데이터 없음</div></div></section>`)}
if(page!=='spatial')w.style.gridTemplateColumns='';let cv=$('map');view=new FleetMapView(cv,{onScale:()=>{}});view.readOnly=true;let r=robot();view.update(r,snapshot.missions);let im=new Image();im.onload=()=>{view.setMapImage(r.robot_id,r.map_version,im);view.fit()};im.src=mapData;$('poseText').textContent=`${selected} · x ${r.state.pose.x.toFixed(2)} / y ${r.state.pose.y.toFixed(2)} m · ${r.state.pose.frame_id} · 표본`;$('fit').onclick=()=>view.fit();$('zoomIn').onclick=()=>view.zoomBy(1.2);$('zoomOut').onclick=()=>view.zoomBy(1/1.2);$('settings').onclick=()=>{$('settingsBox').classList.toggle('open');view.resize()};$('layers').onclick=()=>{$('settingsBox').textContent='지도 / 목표 / 수신 궤적 · 실제 Nav2 계획 API 미제공';$('settingsBox').classList.toggle('open');view.resize()};if($('compose'))$('compose').onclick=()=>$('drawer').classList.add('open');}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render()}const r=e.target.closest('[data-robot]');if(r){selected=r.dataset.robot;render();view.fitRobot()}const m=e.target.closest('[data-spatial]');if(m){spatialMode=m.dataset.spatial;render()}});$('theme').onchange=e=>{theme=e.target.value;document.documentElement.dataset.theme=theme;view.request()};$('drawerClose').onclick=()=>$('drawer').classList.remove('open');$('evidence').onclick=()=>{if(page==='spatial')alert('설계 제안: Safety 증거 Drawer. 현재 표본의 최종 이동 승인 정보는 없습니다.');else document.querySelector('.inspector').scrollIntoView()};render();
</script></body></html>
