explore_node:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.33      # 3초마다 새로운 프론티어 탐색
    progress_timeout: 25.0       # 10초에서 25초로 변경 (실차 주행 및 회피 시 조기 타임아웃 방지)
    potential_scale: 3.0         # 0.1 -> 3.0 (실차 주행 시 가까운 프론티어 우선 탐색하여 주행 거리 단축)
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.6     # 0.3 -> 0.6 (TF 10ms 지연 에러 방지)
    min_frontier_size: 0.20      # 0.75 -> 0.20 (작은 방 및 좁은 미탐색 구역 탐색 최적화)