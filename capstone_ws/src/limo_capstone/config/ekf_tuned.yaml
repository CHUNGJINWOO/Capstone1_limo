# F1b: Tuned 2D EKF (robot_localization ekf_node)
# Decouples planar linear velocity (from Wheel Odometry) and relative heading / angular velocity (from IMU).
# Raw IMU linear acceleration integration is disabled to prevent gravity/bias drift.
# Single authority: publish_tf is FALSE (odom_tf_relay_node manages odom -> base_footprint TF).

ekf_f1b_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    publish_tf: false

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Fuse only linear velocities (vx, vy) from wheel odometry
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Fuse relative yaw (psi) and yaw rate (wz) from IMU
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    use_control: false
