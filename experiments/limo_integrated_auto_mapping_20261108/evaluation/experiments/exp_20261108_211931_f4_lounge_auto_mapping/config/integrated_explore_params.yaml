# integrated_explore_params.yaml
# Explore Lite configuration for Autonomous Frontier Exploration
# Tied to base_footprint and global costmap

explore_node:
  ros__parameters:
    robot_base_frame: base_footprint
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.33      # 3.0 seconds per frontier evaluation cycle
    progress_timeout: 25.0       # 25 seconds movement allowance before selecting new frontier
    potential_scale: 3.0         # Prefers closer frontiers to minimize unnecessary travel
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.6     # Generous tolerance to absorb simulation clock jitter
    min_frontier_size: 0.20      # Sensitive detection of small doorway openings and room corridors
    use_sim_time: true
