# integrated_depth_params.yaml
# Parameters for depth_obstacle_filter node in integrated auto-mapping
depth_obstacle_filter:
  ros__parameters:
    input_topic: /camera/depth/points
    height_frame: base_footprint
    min_range: 0.20
    max_range: 2.50
    min_height: 0.025
    max_height: 0.35
    self_radius: 0.19
    processing_hz: 10.0
    data_timeout_sec: 1.0
    point_stride: 1
    use_sim_time: true
