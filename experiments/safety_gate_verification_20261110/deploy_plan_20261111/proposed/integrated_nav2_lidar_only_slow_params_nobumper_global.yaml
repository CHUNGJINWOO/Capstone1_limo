# integrated_nav2_lidar_only_slow_params.yaml
# SLOW speed profile of integrated_nav2_lidar_only_params.yaml for the first on-ground drive tests.
# Differences vs. the lidar-only file (everything else is identical):
#   FollowPath.desired_linear_vel 0.32 -> 0.15, rotate_to_heading_angular_vel 0.5 -> 0.3,
#   min_approach_linear_velocity 0.15 -> 0.08, regulated_linear_scaling_min_speed 0.18 -> 0.10
#   behavior_server.max_rotational_vel/min_rotational_vel/rotational_acc_lim (new): 0.5 / 0.2 / 1.5
#   velocity_smoother.max_velocity/min_velocity (new): hard cap on the Nav2 controller output path
#   general_goal_checker.yaw_goal_tolerance 0.60 -> 0.45 rad (about 34 deg -> 26 deg). 0.30 rad was tried first: it hunted for 21 s with 3 progress-check failures (see DRIVE_TEST_PLAN.md)
#   EXPLORATION: yaw_goal_tolerance 0.45 -> 3.14 rad (goal heading ignored). explore_lite always sends goals with orientation w=1 (yaw 0 in map), so every frontier goal would otherwise force an in-place turn to yaw 0, and in-place heading control was erratic in D3b (hunting / overshoot).
#   global_costmap obstacle_layer: virtual_bumper observation source removed (local_costmap keeps it) - see DRIVE_TEST_PLAN.md, 'No frontiers found' analysis
# Selected by the real launch with speed_profile:=slow (lidar-only configuration only).
# integrated_nav2_params.yaml
# Production Nav2 Configuration for LIMO Pro Integrated Auto-Mapping System
# Configured for SLAM Toolbox dynamic mapping (/map) + Active State Estimator (odom -> base_footprint)

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_nav2
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Placeholder = Nav2's stock tree (identical to the built-in default). Ackermann launches
    # rewrite this key to config/navigate_to_pose_ackermann_no_reverse.xml (Spin/BackUp removed).
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom_nav2
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.12
      movement_time_allowance: 5.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.40
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.70
      lookahead_time: 1.2
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.30
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    # SLOW PROFILE: cap in-place rotation (behavior_server publishes straight to /cmd_vel_raw, bypassing velocity_smoother).
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.3
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan virtual_bumper
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
        virtual_bumper:
          topic: /stall_detector/virtual_bumper_cloud
          max_obstacle_height: 2.0
          min_obstacle_height: 0.01
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.5
        inflation_radius: 0.28
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      robot_radius: 0.18
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # virtual_bumper removed from the GLOBAL costmap only: the gate's bumper cloud (published in STALL_PENDING, e.g. at motion start while F4 lags)
        # was marked with clearing: False and stayed as a lethal phantom 0.24 m ahead, which put the robot cell in the inflation zone and made
        # explore_lite's BFS lose its frontiers. The local costmap keeps it.
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.5
        inflation_radius: 0.28
      always_send_full_costmap: True

# Hard cap on controller output (velocity_smoother sits between controller_server and /cmd_vel_raw).
# Other smoother parameters keep the Nav2 Humble defaults on purpose.
velocity_smoother:
  ros__parameters:
    use_sim_time: true   # overridden at runtime by the launch (use_sim_time argument)
    max_velocity: [0.15, 0.0, 0.5]
    min_velocity: [-0.10, 0.0, -0.5]
