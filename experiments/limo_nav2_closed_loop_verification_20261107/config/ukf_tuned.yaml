# F2: Tuned UKF (robot_localization ukf_node)
# Purpose: Compare Unscented Kalman Filter nonlinear sigma-point propagation against EKF (F1b)
#          under identical sensor inputs (Wheel Odometry vx,vy + IMU yaw,yaw_rate).

ukf_tuned_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    publish_tf: false

    alpha: 0.001
    kappa: 0.0
    beta: 2.0

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    use_control: false
