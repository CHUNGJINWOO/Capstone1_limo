# F1b: Tuned EKF (robot_localization)
# Purpose: Decouple linear velocity (from Wheel Odometry) and heading/yaw-rate (from IMU),
#          disabling raw IMU linear acceleration integration and duplicate yaw measurement.

ekf_tuned_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false
    publish_tf: false

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Fuse only linear velocities (vx, vy) from wheel odometry
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Fuse yaw and yaw rate (psi, dpsi) from IMU (relative to t=0 heading)
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    use_control: false
