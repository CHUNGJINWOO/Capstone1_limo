depth_obstacle_filter:
  ros__parameters:
    input_topic: /camera/depth/points # USB 기준 astra XYZ 출력. 실물에서 확인 필요
    height_frame: base_footprint     # 지면 기준 z-up 프레임이어야 한다
    min_range: 0.20                  # 아래 값들은 시험 초기값이며 실물 센서·차체로 검증 필요
    max_range: 2.50
    min_height: 0.025                # 바닥 제거가 낮은 보강대까지 지우지 않는지 확인
    max_height: 0.35
    self_radius: 0.19                # 기존 Nav2 반경에 맞춘 자기 차체 제외 원통
    processing_hz: 5.0
    data_timeout_sec: 1.0
    point_stride: 1                  # 얇은 구조 누락을 피하려고 기본값은 샘플 생략 없음
